<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haiku Webpage</title>
    <style>
        body {
            font-family: Georgia, serif;
            color: #2c3e50;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            color: #1a252f;
            margin-bottom: 25px;
            padding-bottom: 10px;
        }
        .haiku-poem {
            font-size: 1.6rem;
            font-style: italic;
            line-height: 1.8;
            margin: 30px 0;
            color: #34495e;
        }
        h2 {
            font-size: 1.1rem;
            font-weight: normal;
            text-transform: uppercase;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
        }
    </style>
</head>
<body>
        <h1>The Taste of Rain</h1>
        <p class="haiku-poem">
            The taste<br>
            Of rain<br>
            —Why kneel?
        </p>
        <h2>Jack Kerouac</h2>
        <img src="img/image_42cb597d.jpg" alt="A young man looking up into the rain">

</body>
</html>

<!-- I chose Georgia because its elegant, traditional serif style describes the calm, reflective, and deeply meditative Zen tone of Jack Kerouac's haiku. -->
